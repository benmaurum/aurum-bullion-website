name: Update Aurum Insights
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-insights.yml'
      - 'scripts/update_news.py'
      - 'data/market-voice-sources.json'
      - 'data/market-voice-editorial.json'
  schedule:
    - cron: '15 7 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current gold news
        run: python scripts/update_news.py
      - name: Publish refreshed feed
        run: |
          git config user.name "Aurum Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Refresh Aurum Insights news feed"
          git push
